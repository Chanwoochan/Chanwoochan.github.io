<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="데일리 모드에서 오늘의 피규어를 뽑거나 프리게임에서 하시와타시와 후크&amp;링을 플레이하세요.">
  <title>게임 로비 · UFO캐쳐</title>
  <link rel="icon" href="./simple/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./lobby.css?v=daily1">
<link rel="stylesheet" href="./account/account.css?v=ranks1">
</head>
<body>
  <header class="topbar">
    <nav class="wrap" aria-label="주 메뉴">
      <a class="brand" href="./" aria-label="UFO캐쳐 게임 로비"><span class="brand-mark" aria-hidden="true"></span>UFO캐쳐</a>
    <div class="account-menu"><small role="status" aria-live="polite"></small><button type="button" data-login disabled title="로그인하면 이 기기의 게스트 기록을 계정에 합칩니다">Google로 로그인</button></div></nav>
  </header>
  <main class="wrap">
    <h1>게임 로비</h1>
    <section class="management" hidden aria-label="관리자 모드">
      <h2>관리자 모드</h2><div class="targets">
        <a href="./freegame/play/?mode=bridge&amp;manage=1">하시와타시 기본값</a>
        <a href="./freegame/play/?mode=hook-ring&amp;manage=1">후크&amp;링 기본값</a>
        <a href="./daily/?manage=1">데일리 공통 설정</a></div>
      <form><label>데일리 날짜 <input type="date" required></label><button>이 날짜의 기기 설정</button></form>
    </section>
    <div class="mode-pair">
    <section class="feature daily-feature" aria-labelledby="daily-title">
      <div class="feature-copy">
        <h2 id="daily-title">데일리 모드</h2>
        <p><strong id="daily-name">오늘의 피규어</strong><br>매일 밤 12시 교체 · 한국 시간</p>
        <a class="play" href="./daily/">오늘의 뽑기 <span aria-hidden="true">→</span></a>
      </div>
      <div class="daily-art" aria-hidden="true"><img id="daily-cover" alt="" hidden></div>
    </section>
    <section class="feature" aria-labelledby="free-title">
      <div class="feature-copy">
        <h2 id="free-title">프리게임</h2>
        <p>하시와타시와 후크&amp;링 중에서<br class="wide"> 원하는 기기를 골라 플레이하세요.</p>
        <a class="play" href="./freegame/">게임 선택 <span aria-hidden="true">→</span></a>
      </div>
      <div class="feature-art" aria-hidden="true"><img src="./assets/lobby-cabinet.png" width="330" height="244" alt=""></div>
    </section>
    </div>
    <section class="upcoming" aria-labelledby="menu-title">
      <h2 id="menu-title">게임 메뉴</h2>
      <ul class="cards">
        <li><div class="card-top"><span class="tile flag" aria-hidden="true"></span><span class="status">준비 중</span></div><h3>챌린지</h3><p>주어진 조건에 맞춰 경품 뽑기</p></li>
        <li class="available"><div class="card-top"><span class="tile trophy" aria-hidden="true"></span><span class="status" aria-hidden="true">열기 →</span></div><h3><a href="./ranking/">오늘의 랭킹</a></h3><p>오늘 뽑은 경품 수로 순위 보기</p></li>
        <li class="available"><div class="card-top"><span class="tile parcel" aria-hidden="true"></span><span class="status" aria-hidden="true">열기 →</span></div><h3><a href="./collection/">경품 도감</a></h3><p>뽑은 경품을 한곳에서 모아보기</p></li>
      </ul>
    </section>
  </main>
  <script type="module" src="./daily/lobby.js"></script>
<script type="module" src="./account/menu.js?v=ranks1"></script>
</body>
</html>
