<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="UFO캐쳐 게임 로비. 프리게임에서 두 버튼으로 집게를 움직여 DUMMY 박스를 뽑아보세요.">
  <title>게임 로비 · UFO캐쳐</title>
  <link rel="icon" href="./simple/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./lobby.css">
</head>
<body>
  <header class="topbar">
    <nav class="wrap" aria-label="주 메뉴">
      <a class="brand" href="./" aria-label="UFO캐쳐 게임 로비"><span class="brand-mark" aria-hidden="true"></span>UFO캐쳐</a>
      <a class="classic" href="./cygnus.html">시그너스 버전 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main class="wrap">
    <h1>게임 로비</h1>
    <section class="feature" aria-labelledby="free-title">
      <div class="feature-copy">
        <h2 id="free-title">프리게임</h2>
        <p>집게를 움직여 봉 위의 DUMMY 박스를<br class="wide"> 아래로 떨어뜨려 보세요.</p>
        <a class="play" href="./freegame/">플레이하기 <span aria-hidden="true">→</span></a>
      </div>
      <div class="feature-art" aria-hidden="true"><img src="./assets/lobby-cabinet.png" width="330" height="244" alt=""></div>
    </section>
    <section class="upcoming" aria-labelledby="menu-title">
      <h2 id="menu-title">게임 메뉴</h2>
      <ul class="cards">
        <li><div class="card-top"><span class="tile flag" aria-hidden="true"></span><span class="status">준비 중</span></div><h3>챌린지</h3><p>주어진 조건에 맞춰 경품 뽑기</p></li>
        <li><div class="card-top"><span class="tile trophy" aria-hidden="true"></span><span class="status">준비 중</span></div><h3>랭킹</h3><p>플레이 기록과 순위 보기</p></li>
        <li><div class="card-top"><span class="tile parcel" aria-hidden="true"></span><span class="status">준비 중</span></div><h3>경품 도감</h3><p>뽑은 경품을 한곳에서 모아보기</p></li>
      </ul>
    </section>
  </main>
</body>
</html>
