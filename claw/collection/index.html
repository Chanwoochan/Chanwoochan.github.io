<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>경품 도감 · UFO캐쳐</title>
  <link rel="icon" href="../simple/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../lobby.css?v=collection">
  <link rel="stylesheet" href="./collection.css">
<link rel="stylesheet" href="../account/account.css?v=ranks1">
</head>
<body>
  <header class="topbar"><nav class="wrap" aria-label="주 메뉴">
    <a class="brand" href="../"><span class="brand-mark" aria-hidden="true"></span>UFO캐쳐</a>
    <a class="classic" href="../">← 게임 로비</a>
  <div class="account-menu"><small role="status" aria-live="polite"></small><button type="button" data-login disabled title="로그인하면 이 기기의 게스트 기록을 계정에 합칩니다">Google로 로그인</button></div></nav></header>
  <main class="wrap">
    <header class="collection-head">
      <div><h1>경품 도감</h1><p>게스트 기록은 이 기기에 저장됩니다. Google로 로그인하면 게스트 기록을 계정에 합쳐 다른 기기에서도 볼 수 있습니다.</p></div>
      <div class="summary" aria-live="polite">
        <span>수집한 경품</span><strong id="total">불러오는 중…</strong>
        <progress id="progress" aria-label="경품 수집률"></progress>
      </div>
    </header>
    <p id="storage-error" role="status" hidden>이 브라우저에서 획득 기록을 불러올 수 없습니다.</p>
    <details class="record-list"><summary>내 플레이 기록</summary><p id="record-status" role="status"></p><ul id="record-history"></ul></details>
    <section class="shelf" aria-label="경품 목록" id="shelf"></section>
    <noscript>획득 기록을 보려면 브라우저의 JavaScript를 켜주세요.</noscript>
  </main>
  <template id="prize">
    <article class="prize">
      <div class="display"><img class="package" alt=""><span class="ownership"></span></div>
      <div class="details">
        <h2></h2><p class="description"></p>
        <dl class="first" hidden><dt>첫 획득</dt><dd></dd></dl>
        <ul class="games" aria-label="플레이할 게임과 획득 수"></ul>
      </div>
    </article>
  </template>
  <script type="module" src="./collection.js?v=ranks1"></script>
<script type="module" src="../account/menu.js?v=ranks1"></script>
</body>
</html>
